[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 460800
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=1

[env:esp32]
build_src_filter = +<*> -<test/>
lib_deps =
    bblanchon/ArduinoJson@^7.1.0

; ===== 硬件自检环境 =====
; 用法: pio run -e test_<名称> -t upload
; 共享: src/test/test_common.h
[env:test_led]
build_src_filter = -<*> +<test/test_led.cpp>

[env:test_wifi]
build_src_filter = -<*> +<test/test_wifi.cpp>

[env:test_hall]
build_src_filter = -<*> +<test/test_hall.cpp>

[env:test_endstop]
build_src_filter = -<*> +<test/test_endstop.cpp>

[env:test_servo]
build_src_filter = -<*> +<test/test_servo.cpp>

[env:test_motor]
build_src_filter = -<*> +<test/test_motor.cpp>

[env:test_encoder]
build_src_filter = -<*> +<test/test_encoder.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
